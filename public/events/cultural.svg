<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cultural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="50%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg-cultural)"/>
  <!-- Decorative Mandala Rays -->
  <g transform="translate(320, 160)" stroke="url(#gold-bright)" stroke-width="1.5" stroke-opacity="0.25">
    <circle cx="0" cy="0" r="120" fill="none"/>
    <circle cx="0" cy="0" r="90" fill="none"/>
    <circle cx="0" cy="0" r="60" fill="none"/>
    <line x1="-130" y1="0" x2="130" y2="0"/>
    <line x1="0" y1="-130" x2="0" y2="130"/>
    <line x1="-92" y1="-92" x2="92" y2="92"/>
    <line x1="-92" y1="92" x2="92" y2="-92"/>
  </g>
  <!-- Festivity Diya / Lantern Center -->
  <g transform="translate(320, 155)">
    <circle cx="0" cy="0" r="48" fill="#4c0519" stroke="url(#gold-bright)" stroke-width="2.5"/>
    <!-- Flame / Lotus -->
    <path d="M0,-24 C12,-10 16,6 0,20 C-16,6 -12,-10 0,-24 Z" fill="url(#gold-bright)"/>
    <circle cx="0" cy="6" r="6" fill="#ffffff"/>
  </g>
  <text x="320" y="275" font-family="sans-serif" font-size="14" font-weight="700" fill="#fbcfe8" letter-spacing="4" text-anchor="middle">CULTURAL &amp; ARTS FESTIVAL</text>
</svg>
