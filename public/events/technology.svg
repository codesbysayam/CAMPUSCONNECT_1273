<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Tech Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="0" y1="72" x2="640" y2="72"/>
    <line x1="0" y1="144" x2="640" y2="144"/>
    <line x1="0" y1="216" x2="640" y2="216"/>
    <line x1="0" y1="288" x2="640" y2="288"/>
    <line x1="128" y1="0" x2="128" y2="360"/>
    <line x1="256" y1="0" x2="256" y2="360"/>
    <line x1="384" y1="0" x2="384" y2="360"/>
    <line x1="512" y1="0" x2="512" y2="360"/>
  </g>
  <!-- Circuit Nodes -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="128" cy="144" r="5"/>
    <circle cx="256" cy="216" r="6"/>
    <circle cx="384" cy="144" r="5"/>
    <circle cx="512" cy="216" r="6"/>
  </g>
  <!-- Central Tech Terminal Card -->
  <rect x="180" y="80" width="280" height="190" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="url(#accent)" stroke-width="2.5"/>
  <rect x="200" y="105" width="240" height="24" rx="4" fill="#1e293b"/>
  <circle cx="215" cy="117" r="4" fill="#ef4444"/>
  <circle cx="228" cy="117" r="4" fill="#f59e0b"/>
  <circle cx="241" cy="117" r="4" fill="#10b981"/>
  <!-- Code brackets -->
  <text x="320" y="200" font-family="monospace" font-size="44" font-weight="bold" fill="url(#accent)" text-anchor="middle">&lt;code /&gt;</text>
  <text x="320" y="240" font-family="sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="3" text-anchor="middle">TECHNOLOGY &amp; COMPUTING</text>
</svg>
