<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sports" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg-sports)"/>
  <!-- Field markings -->
  <circle cx="320" cy="180" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
  <line x1="320" y1="0" x2="320" y2="360" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
  <rect x="20" y="20" width="600" height="320" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
  <!-- Sports Emblem -->
  <g transform="translate(320, 160)">
    <!-- Trophy / Medal Badge -->
    <circle cx="0" cy="0" r="54" fill="#064e3b" stroke="url(#gold)" stroke-width="3"/>
    <!-- Trophy Icon -->
    <path d="M-22,-20 L22,-20 L16,6 C14,16 6,24 0,26 C-6,24 -14,16 -16,6 Z" fill="url(#gold)"/>
    <path d="M-22,-14 C-32,-14 -32,2 -20,2" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M22,-14 C32,-14 32,2 20,2" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <rect x="-6" y="26" width="12" height="12" fill="url(#gold)"/>
    <rect x="-16" y="38" width="32" height="6" rx="2" fill="url(#gold)"/>
  </g>
  <text x="320" y="275" font-family="sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" letter-spacing="4" text-anchor="middle">ATHLETICS &amp; SPORTS</text>
</svg>
