<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-workshop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg-workshop)"/>
  <!-- Workshop Blueprint Grid -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <!-- Drafting Compass / Pen Center -->
  <g transform="translate(320, 155)">
    <circle cx="0" cy="0" r="50" fill="#451a03" stroke="#fef08a" stroke-width="2.5"/>
    <!-- Pencil & Ruler cross -->
    <path d="M-18,-18 L18,18 M-14,-22 L22,14 M-22,-14 L14,22" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#f59e0b"/>
  </g>
  <text x="320" y="275" font-family="sans-serif" font-size="14" font-weight="700" fill="#fde68a" letter-spacing="4" text-anchor="middle">HANDS-ON WORKSHOP</text>
</svg>
